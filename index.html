<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal Gender</title>
    <style>
        #namesContainer {
            display: none;
            position: center;
            background-color: black;
            border: 1px solid white;
            padding: 10px;
            z-index: 1000;
            font-size: 120px;
            /* Increase font size */
            color: gray;
            /* Improve text contrast */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* Add shadow for better visibility */
            border-radius: 8px;
            /* Round the corners */
            text-align: center;
            /* Center text horizontally */
        }
    </style>
</head>

<body style="background-color: black;">
    <div id="namesContainer"></div>
    <center>
        <button id="btnRev" onclick="revealGender()"
            style="position: center; font-size: 20px; padding: 15px; border-radius: 10px; background-color: white; color: black;">
            Reveal </button>
    </center>
    <script>

        const names = ["Alice", "Bob", "Charlie", "Diana", "Eve", "Frank", "Grace", "Ernesto", "Jandira", "Frederick"];

        let sexSelected = "Menina";
        // Função auxiliar para criar uma pausa (delay)
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function revealGender() {
            btnRev.style.display = 'none';
            const namesContainer = document.getElementById('namesContainer');

            for (let index = 0; index < names.length; index++) {
                let randomIndex = Math.floor(Math.random() * names.length);
                nameToShow = names[randomIndex];
                namesContainer.textContent = nameToShow;
                namesContainer.style.display = 'block';
                await sleep(500);
                namesContainer.style.display = 'none';
                await sleep(100); // pequena pausa invisível
            }

            // Ao final de tudo, apaga e esconde
            namesContainer.textContent = "";
            namesContainer.style.display = 'none';

            namesContainer.textContent = sexSelected;
            namesContainer.style.display = 'block';
            namesContainer.style.color = 'white';

        }
    </script>
</body>

</html>
