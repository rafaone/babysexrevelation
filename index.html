<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reveal Gender</title>
    <style>
        #namesContainer {
            display: none;
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background-color: black;
            border: 1px solid white;
            padding: 40px;
            z-index: 1000;
            font-size: 72px;
            color: gray;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
            font-family: 'Arial', sans-serif;
            /* Changed font-family */
        }

        .boy {
            position: absolute;
            width: 50px;
            height: 80px;
            background-color: rgb(251, 255, 35);
            clip-path: polygon(
                    /* Head */
                    40% 0%, 60% 0%, 60% 20%, 40% 20%,
                    /* Neck and Right Shoulder */
                    40% 25%, 80% 25%,
                    /* Right Arm */
                    80% 50%, 70% 50%, 70% 30%,
                    /* Right Side of Body */
                    60% 30%, 60% 60%,
                    /* Right Leg */
                    75% 100%, 55% 100%, 50% 70%,
                    /* Left Leg */
                    45% 100%, 25% 100%, 40% 60%,
                    /* Left Side of Body */
                    40% 30%, 30% 30%, 30% 50%,
                    /* Left Arm and Shoulder */
                    20% 50%, 20% 25%, 40% 25%);
        }

        .girl {
            position: absolute;
            width: 50px;
            height: 80px;
            background-color: rgb(251, 255, 35);
            clip-path: polygon(
                    /* Head: Triangle with point downwards */
                    35% 0%, 65% 0%, 50% 20%,
                    /* Neck and Left Shoulder */
                    50% 20%, 30% 25%,
                    /* Left Arm */
                    10% 25%, 10% 35%, 30% 35%,
                    /* Dress (Left Side) */
                    35% 45%, 15% 85%,
                    /* Left Leg */
                    40% 85%, 40% 100%, 48% 100%, 48% 85%,
                    /* Right Leg */
                    52% 85%, 52% 100%, 60% 100%, 60% 85%,
                    /* Dress (Right Side) */
                    85% 85%, 65% 45%,
                    /* Right Arm and Shoulder */
                    70% 35%, 90% 35%, 90% 25%, 70% 25%,
                    /* Closure at Neck */
                    50% 20%);
        }
    </style>
</head>

<body style="background-color: black;">
    <div id="namesContainer"></div>
    <center>
        <button id="btnRev" onclick="revealGender()"
            style="position: center; font-size: 20px; padding: 15px; border-radius: 10px; background-color: white; color: black;">
            Reveal </button>
    </center>
    <script>
        let sexSelected = "Boy";

        const names = ["Alice", "Bob", "Bia", "Diana", "Pedro",
            "Nicholas", "Grace", "Ernesto", "Angelica", "Alvaro",
            "Frederick", "Maria", "Nena", "Dinho", "Bernardo", "Pura"];
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Function to reveal gender
        async function revealGender() {
            btnRev.style.display = 'none';
            const namesContainer = document.getElementById('namesContainer');
            let usedNumbers = [];

            for (let index = 0; index < names.length; index++) {
                let randomIndex = Math.floor(Math.random() * names.length);

                while (usedNumbers.includes(randomIndex)) {
                    randomIndex = Math.floor(Math.random() * names.length);
                }
                usedNumbers.push(randomIndex);

                //more snowflakes
                for (let index = 0; index < 20; index++) {
                    createDoll(index);
                    await sleep(50);
                }

                // Save the number to avoid repetition
                nameToShow = names[randomIndex];
                namesContainer.textContent = nameToShow;
                namesContainer.style.display = 'block';

                await sleep(300);
                namesContainer.style.display = 'none';
                await sleep(100); // pequena pausa invisível

            }

            // Ao final de tudo, apaga e esconde
            namesContainer.textContent = "";
            namesContainer.style.display = 'none';
            //more snowflakes
            for (let index = 0; index < 500; index++) {
                createDoll(index);
                await sleep(10);
            }
            await sleep(100);
            namesContainer.textContent = sexSelected;
            namesContainer.style.fontSize = '100px';
            namesContainer.style.display = 'block';
            if (sexSelected == 'Menina' || sexSelected == 'Female' || sexSelected == 'Girl')
                namesContainer.style.color = 'red';
            else
                namesContainer.style.color = 'blue';

        }
        // effect girl or boy
        async function createDoll(number) {
            const doll = document.createElement('div');
            if (number % 2 === 0) {
                doll.classList.add('boy');
            } else {
                doll.classList.add('girl');
            }

            doll.style.left = Math.random() * window.innerWidth + 'px';
            doll.style.bottom = Math.random() * window.innerWidth + 'px';
            doll.style.animationDuration = (Math.random() * 3 + 2) + 's';
            let color;
            if (number % 2 === 0) {
                color = `rgb(${Math.floor(Math.random() * 64)}, ${Math.floor(Math.random() * 64)}, 255)`;
            } else {
                color = `rgb(255, ${Math.floor(Math.random() * 64)}, ${Math.floor(Math.random() * 64)})`;
            }
            doll.style.background = color;
            let randomRotate = Math.floor(Math.random() * 360) + 'deg';
            doll.style.transform = 'rotate(' + randomRotate + ')';
            document.body.appendChild(doll);
        }
    </script>
</body>

</html>
